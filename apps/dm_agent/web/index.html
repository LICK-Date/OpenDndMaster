<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Master Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grain"></div>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Riverside Session Console</p>
        <h1>Dungeon Master</h1>
        <p class="header-copy">把当前 CLI 跑团后端包进一个可玩的聊天式界面里。</p>
      </div>
      <div class="world-controls">
        <label class="field-label" for="world-id">World</label>
        <input id="world-id" type="text" value="campaign_01" list="world-suggestions" spellcheck="false">
        <datalist id="world-suggestions"></datalist>
        <button id="load-world" class="ghost-btn">Load</button>
        <button id="create-world" class="ghost-btn">New</button>
      </div>
    </header>

    <main class="layout">
      <section class="chat-panel card">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Session Feed</p>
            <h2 id="world-title">Awaiting world</h2>
            <p id="world-path" class="world-path">尚未载入世界。</p>
          </div>
          <div class="meta-pill-row">
            <span class="meta-pill" id="source-pill">template</span>
            <span class="meta-pill" id="roll-pill">no roll</span>
          </div>
        </div>

        <div id="chat-log" class="chat-log">
          <article class="message system">
            <p>壁炉还没完全烧旺。先选择一个世界，然后写下你的第一步行动。</p>
          </article>
        </div>

        <form id="turn-form" class="composer">
          <label class="field-label" for="turn-input">Your move</label>
          <textarea id="turn-input" rows="4" placeholder="例如：我走近吧台，对Mara说我想打听最近码头上的怪事。"></textarea>
          <div class="composer-actions">
            <p id="status-line" class="status-line">Ready. Enter 发送，Shift+Enter 换行。</p>
            <button id="send-turn" type="submit" class="send-btn">Send Turn</button>
          </div>
        </form>
      </section>

      <aside class="side-panel">
        <section class="card stat-card">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">Traveler</p>
              <h3 id="player-name">Unknown</h3>
            </div>
            <span id="player-location" class="location-badge">Nowhere</span>
          </div>
          <p id="player-background" class="muted-copy"></p>
          <div id="attribute-grid" class="attribute-grid"></div>
          <div class="reputation-strip">
            <div><span>Notoriety</span><strong id="rep-notoriety">0</strong></div>
            <div><span>Goodwill</span><strong id="rep-goodwill">0</strong></div>
            <div><span>Heroic</span><strong id="rep-heroic">0</strong></div>
          </div>
        </section>

        <section class="card world-card">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">World</p>
              <h3 id="world-city">Unknown</h3>
            </div>
          </div>
          <p id="world-tone" class="muted-copy"></p>
          <div class="chip-row" id="faction-row"></div>
        </section>

        <section class="card npc-card">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">Cast</p>
              <h3>NPCs</h3>
            </div>
          </div>
          <div id="npc-list" class="npc-list"></div>
        </section>

        <section class="card recent-card">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">Trace</p>
              <h3>Recent Events</h3>
            </div>
          </div>
          <ul id="recent-events" class="recent-list"></ul>
        </section>
      </aside>
    </main>
  </div>

  <template id="message-template">
    <article class="message">
      <span class="speaker"></span>
      <p class="content"></p>
    </article>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
