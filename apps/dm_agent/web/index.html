<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地下城主控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grain"></div>
  <div class="app-shell">
    <main class="workspace-grid">
      <aside class="app-nav card">
        <div class="brand-block">
          <h1>Dungeon</h1>
          <h1>Master</h1>
        </div>

        <section class="nav-section player-section">
          <div class="section-head">
            <span class="section-dot"></span>
            <p class="section-title">角色概览</p>
          </div>
          <div class="nav-card player-card">
            <div class="player-topline">
              <div>
                <p class="eyebrow small">角色</p>
                <h3 id="player-name">未命名</h3>
              </div>
              <span id="player-location" class="location-badge">未知地点</span>
            </div>
            <p id="player-background" class="nav-copy"></p>
            <div id="attribute-grid" class="attribute-grid compact"></div>
          </div>
        </section>

        <section class="nav-section nav-utility-bar" aria-label="快捷操作">
          <button id="import-world-btn" class="utility-btn" type="button" aria-label="导入世界" data-tooltip="导入世界">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v10"></path>
              <path d="M8 8l4-4 4 4"></path>
              <path d="M5 14v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"></path>
            </svg>
          </button>
          <button id="export-world-btn" class="utility-btn" type="button" aria-label="导出世界" data-tooltip="导出世界">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20V10"></path>
              <path d="M8 16l4 4 4-4"></path>
              <path d="M5 10V6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v4"></path>
            </svg>
          </button>
          <button id="open-settings-btn" class="utility-btn" type="button" aria-label="设置" data-tooltip="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.5A3.5 3.5 0 1 0 12 15.5A3.5 3.5 0 1 0 12 8.5Z"></path>
              <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1 1 0 0 1 0 1.4l-1.2 1.2a1 1 0 0 1-1.4 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1 1 0 0 1-1 1h-1.6a1 1 0 0 1-1-1v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1 1 0 0 1-1.4 0l-1.2-1.2a1 1 0 0 1 0-1.4l.1-.1A1 1 0 0 0 5 15a1 1 0 0 0-.9-.6H4a1 1 0 0 1-1-1v-1.6a1 1 0 0 1 1-1h.2A1 1 0 0 0 5 9.9a1 1 0 0 0-.2-1.1l-.1-.1a1 1 0 0 1 0-1.4l1.2-1.2a1 1 0 0 1 1.4 0l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4a1 1 0 0 1 1-1h1.6a1 1 0 0 1 1 1v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1 1 0 0 1 1.4 0l1.2 1.2a1 1 0 0 1 0 1.4l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2a1 1 0 0 1 1 1v1.6a1 1 0 0 1-1 1h-.2a1 1 0 0 0-.9.6Z"></path>
            </svg>
          </button>
        </section>

      </aside>

      <section class="main-stage card">
        <header class="stage-head">
          <div>
            <p class="eyebrow">对话</p>
            <h2 id="world-title">等待载入世界</h2>
            <p id="world-path" class="world-path">尚未载入世界。</p>
          </div>
        </header>

        <div class="stage-feed">
          <div id="chat-log" class="chat-log chat-log-stage">
            <article class="message system">
              <p>壁炉还没完全烧旺。先选择一个世界，然后写下你的第一步行动。</p>
            </article>
          </div>

        </div>

        <form id="turn-form" class="composer composer-bottom">
          <label class="field-label" for="turn-input">你的行动</label>
          <textarea id="turn-input" rows="5" placeholder="例如：我走近吧台，对老板说我想打听最近码头上的怪事。"></textarea>
          <div class="composer-actions">
            <p id="status-line" class="status-line">就绪。回车发送，换行请使用组合键。</p>
            <button id="send-turn" type="submit" class="send-btn">发送</button>
          </div>
        </form>
      </section>

      <section class="session-rail card">
        <section class="nav-section current-world-section rail-world-section">
          <div class="section-head">
            <span class="section-dot"></span>
            <p class="section-title">当前世界</p>
          </div>
          <div class="nav-world-card">
            <h2 id="nav-world-name">等待载入世界</h2>
            <p id="world-city" class="nav-world-city">未知地点</p>
            <p id="world-tone" class="nav-copy">尚未载入世界。</p>
            <div class="chip-row" id="faction-row"></div>
          </div>
        </section>

        <section id="world-archive-panel" class="session-list-wrap rail-card collapsible-card expanded">
          <div class="archive-head collapsible-head">
            <div class="archive-title-wrap">
              <span class="section-dot"></span>
              <p class="section-title archive-label">世界档案</p>
            </div>
            <div class="archive-actions">
              <button id="create-world" class="icon-btn" type="button" title="新建世界" aria-label="新建世界">+</button>
              <button id="toggle-world-archive" class="collapse-btn" type="button" aria-expanded="true" aria-controls="world-archive-body" title="展开或收起世界档案">▾</button>
            </div>
          </div>
          <div id="world-archive-body" class="collapsible-body archive-body">
            <input id="world-id" type="hidden" value="campaign_01">
            <form id="create-world-form" class="create-world-form" hidden>
              <label class="settings-field" for="create-world-input">
                <span>新的世界编号</span>
                <input id="create-world-input" type="text" placeholder="例如：超级棒棒糖" autocomplete="off">
              </label>
              <div class="create-world-actions">
                <button id="confirm-create-world" class="send-btn" type="submit">创建世界</button>
                <button id="cancel-create-world" class="ghost-btn mini-ghost" type="button">取消</button>
              </div>
            </form>
            <datalist id="world-suggestions"></datalist>
            <div id="session-list" class="session-list"></div>
          </div>
        </section>

        <section id="npc-panel" class="rail-card compact-card collapsible-card collapsed upward-collapsible">
          <div class="archive-head collapsible-head">
            <div class="archive-title-wrap">
              <span class="section-dot"></span>
              <p class="section-title archive-label">登场角色</p>
            </div>
            <button id="toggle-npc-panel" class="collapse-btn" type="button" aria-expanded="false" aria-controls="npc-panel-body" title="展开或收起登场角色">▸</button>
          </div>
          <div id="npc-panel-body" class="collapsible-body" hidden>
            <div id="npc-list" class="npc-list compact-list rail-npc-list"></div>
          </div>
        </section>

        <section id="recent-events-panel" class="rail-card compact-card collapsible-card collapsed upward-collapsible">
          <div class="archive-head collapsible-head">
            <div class="archive-title-wrap">
              <span class="section-dot"></span>
              <p class="section-title archive-label">最近事件</p>
            </div>
            <button id="toggle-recent-events" class="collapse-btn" type="button" aria-expanded="false" aria-controls="recent-events-wrap" title="展开或收起最近事件">▸</button>
          </div>
          <div id="recent-events-wrap" class="collapsible-body" hidden>
            <ul id="recent-events" class="recent-list"></ul>
          </div>
        </section>
      </section>
    </main>
  </div>

  <template id="message-template">
    <article class="message">
      <span class="speaker"></span>
      <p class="content"></p>
    </article>
  </template>

  <div id="settings-modal" class="settings-modal" hidden>
    <div class="settings-backdrop" data-close-settings></div>
    <section class="settings-dialog card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-head">
        <div>
          <p class="eyebrow">设置</p>
          <h2 id="settings-title">模型接入管理</h2>
          <p class="settings-copy">为跑团会话添加、编辑并切换当前使用的模型配置。</p>
        </div>
        <button id="close-settings-btn" class="close-btn" type="button" aria-label="关闭设置">×</button>
      </header>
      <div class="settings-layout">
        <aside class="settings-sidebar">
          <div class="settings-sidebar-head">
            <div>
              <p class="section-title">模型配置</p>
              <p class="settings-copy small">选择一个已有配置，或新建一条接入信息。</p>
            </div>
            <button id="new-llm-profile-btn" class="ghost-btn mini-ghost" type="button">新建</button>
          </div>
          <div id="llm-profile-list" class="llm-profile-list"></div>
        </aside>
        <section class="settings-main">
          <form id="llm-settings-form" class="llm-settings-form">
            <input id="llm-profile-id" type="hidden">
            <label class="settings-field">
              <span>配置名称</span>
              <input id="llm-profile-label" type="text" placeholder="例如：主力模型">
            </label>
            <label class="settings-field">
              <span>模型名</span>
              <input id="llm-profile-model" type="text" placeholder="例如：服务商/模型名称">
            </label>
            <label class="settings-field">
              <span>接入地址</span>
              <input id="llm-profile-base-url" type="text" placeholder="例如：https://你的模型服务/v1">
            </label>
            <label class="settings-field">
              <span>接口密钥</span>
              <input id="llm-profile-api-key" type="password" placeholder="例如：在这里粘贴接口密钥">
            </label>
            <div class="settings-grid">
              <label class="settings-field">
                <span>超时秒数</span>
                <input id="llm-profile-timeout" type="number" min="1" step="1" value="60">
              </label>
              <label class="settings-field">
                <span>采样温度</span>
                <input id="llm-profile-temperature" type="number" min="0" max="2" step="0.1" value="0.7">
              </label>
            </div>
            <label class="settings-toggle">
              <input id="llm-profile-json" type="checkbox" checked>
              <span>强制结构化输出</span>
            </label>
            <div class="settings-actions">
              <button id="save-llm-profile-btn" class="send-btn" type="submit">保存配置</button>
              <button id="activate-llm-profile-btn" class="ghost-btn" type="button">设为当前</button>
              <button id="delete-llm-profile-btn" class="ghost-btn danger-ghost" type="button">删除</button>
            </div>
            <p id="settings-status" class="settings-status">这里会显示保存和切换结果。</p>
          </form>
        </section>
      </div>
    </section>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
